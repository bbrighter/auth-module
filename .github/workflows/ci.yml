name: Test

on:
    push:
        tags:
            - "v*"
        branches:
            - "**"
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "pnpm"

            - name: Get packages
              run: pnpm install

            - name: Lint
              run: pnpm lint

            - name: Test
              run: pnpm test

    publish:
        needs: test
        if: startsWith(github.ref, 'refs/tags/v') && success()
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "pnpm"

            - name: Get packages
              run: pnpm install

            - name: Sync version from tag
              run: pnpm version ${GITHUB_REF_NAME#v} --no-git-tag-version

            - name: Build
              run: pnpm build

            - name: Publish to npm
              run: pnpm publish --provenance --ignore-scripts --no-git-checks
