pre-commit:
  jobs:
    - name: Lint
      run: pnpm lint:fix
    - name: Detect dead code
      run: pnpm knip
    - name: Typecheck
      run: pnpm typecheck
    - name: Dependencies
      run: pnpm dependencies:ci

pre-push:
  jobs:
    - name: Test
      run: pnpm test


